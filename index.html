<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading dashboard</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --border: #2a3544;
    --text: #e7ecf3;
    --muted: #8b9bb0;
    --above: #3dd68c;
    --above-bg: rgba(61, 214, 140, 0.12);
    --below: #ff6b6b;
    --below-bg: rgba(255, 107, 107, 0.14);
    --accent: #5b9fd4;
    --accent-bg: rgba(91, 159, 212, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 1.5rem;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 1rem;
  }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.65rem;
  }
  .tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    background: var(--accent-bg);
    border-color: var(--border);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .market {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .market-card, .etf-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .market-card .label, .etf-card .label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.35rem;
  }
  .market-card .row, .etf-card .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .sym { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
  .price { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bottom {
    margin-top: 0.55rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
  }
  .pill strong { font-weight: 650; }
  .pill.ok strong { color: var(--above); }
  .pill.bad strong { color: var(--below); }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  section h2 span { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  .index-card .name { margin-top: 0.35rem; min-height: 1.3em; }
  .sheet-link { color: var(--accent); text-decoration: none; font-size: 0.82rem; }
  .sheet-link:hover { text-decoration: underline; }
  .status.neutral { color: var(--muted); background: rgba(139, 155, 176, 0.12); }
  .etf-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .etf-summary .pill { margin: 0; }
  .table-wrap { overflow-x: auto; }
  .compact th, .compact td { padding: 0.52rem 0.8rem; }
  .mover-period { padding: 0.8rem 1rem 0; }
  .mover-period:last-child { padding-bottom: 1rem; }
  .mover-period h3 {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin: 0 0 0.55rem;
    color: var(--text);
    font-size: 0.88rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .mover-period h3 span { color: var(--muted); font-size: 0.78rem; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .mover-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0.75rem; }
  .mover-side { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mover-side h4 { margin: 0; padding: 0.5rem 0.7rem; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .mover-side.gainer h4 { color: var(--above); background: var(--above-bg); }
  .mover-side.loser h4 { color: var(--below); background: var(--below-bg); }
  .mover-side table { font-size: 0.86rem; }
  .mover-side th, .mover-side td { padding: 0.45rem 0.65rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 0.65rem 1rem; text-align: left; }
  th { color: var(--muted); font-weight: 550; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .ticker { font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .status, .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 650;
    letter-spacing: 0.03em;
  }
  .status.above, .badge.strong { color: var(--above); background: var(--above-bg); }
  .status.below, .badge.weak { color: var(--below); background: var(--below-bg); }
  .badge.mixed { color: var(--accent); background: var(--accent-bg); }
  .num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--above); }
  .neg { color: var(--below); }
  .empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--muted);
  }
  footer {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Trading dashboard</h1>
      <div class="meta">Positions 10DMA · Markets (QQQ / SPMO / IPO)</div>
    </div>
    <div class="meta" id="header-updated">—</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="positions" type="button">Positions</button>
    <button class="tab" data-tab="markets" type="button">Markets</button>
  </div>

  <div id="panel-positions" class="panel active">
    <div class="market" id="market"></div>
    <div class="summary">
      <div class="pill">Positions <strong id="total-count">—</strong></div>
      <div class="pill ok">Above <strong id="above-count">—</strong></div>
      <div class="pill bad">Below <strong id="below-count">—</strong></div>
    </div>
    <div id="lists"></div>
  </div>

  <div id="panel-markets" class="panel">
    <div class="meta" id="markets-updated" style="margin-bottom:0.85rem"></div>
    <div class="market" id="indexes"></div>
    <div id="etf-list"></div>
    <div id="movers"></div>
  </div>

  <footer>
    Sources: Deepvue (positions) · Markets bot (QQQ/SPMO/IPO) · Not financial advice

      "ticker": "TAN",
      "name": "Invesco Solar ETF",
      "pct": -11.58,
      "price": 43.43,
      "sma50": 48.873,
      "pctVsSma50": -11.14,
      "vsSma50": "BELOW",
      "note": ""
    },
    {
      "list": "ETF_LIST",
      "period": "ytd",
      "side": "loser",
      "rank": 4,
      "ticker": "FXI",
      "name": "iShares China Large-Cap ETF",
      "pct": -11.57,
      "price": 33.86,
      "sma50": 35.1816,
      "pctVsSma50": -3.76,
      "vsSma50": "BELOW",
      "note": ""
    },
    {
      "list": "ETF_LIST",
      "period": "ytd",
      "side": "loser",
      "rank": 5,
      "ticker": "XLY",
      "name": "Consumer Discretionary Select Sector SPDR",
      "pct": -8.59,
      "price": 109.15,
      "sma50": 114.5854,
      "pctVsSma50": -4.74,
      "vsSma50": "BELOW",
      "note": ""
    }
  ]
};

  function fmtPct(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return "—";
    return (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%";
  }
  function fmtPrice(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return "—";
    return Number(n).toLocaleString("en-US", { style: "currency", currency: "USD" });
  }

  function renderPositions() {
    const data = window.POSITIONS_10DMA;
    const listsEl = document.getElementById("lists");
    const marketEl = document.getElementById("market");
    if (!data.updated || !data.lists || !data.lists.length) {
      listsEl.innerHTML = '<section><div class="empty">No positions snapshot yet.</div></section>';
      return;
    }
    document.getElementById("header-updated").textContent =
      "Positions · " + data.updated + (data.session ? " · " + data.session : "");

    marketEl.innerHTML = (data.market || []).map(m => {
      const st = m.status === "ABOVE" ? "above" : "below";
      const dayClass = (m.dayPct ?? 0) >= 0 ? "pos" : "neg";
      return `<div class="market-card">
        <div class="label">Market · 10DMA</div>
        <div class="row"><div class="sym">${m.ticker}</div><div class="price">${fmtPrice(m.price)}</div></div>
        <div class="bottom">
          <span class="status ${st}">${m.status}</span>
          <span class="num ${dayClass}">${fmtPct(m.dayPct)}</span>
        </div>
        ${m.note ? `<div class="meta" style="margin-top:0.45rem">${m.note}</div>` : ""}
      </div>`;
    }).join("");

    let above = 0, below = 0, total = 0;
    data.lists.forEach(list => list.positions.forEach(p => {
      total++; if (p.status === "ABOVE") above++; else below++;
    }));
    document.getElementById("total-count").textContent = total;
    document.getElementById("above-count").textContent = above;
    document.getElementById("below-count").textContent = below;

    listsEl.innerHTML = data.lists.map(list => {
      const a = list.positions.filter(p => p.status === "ABOVE").length;
      const b = list.positions.filter(p => p.status === "BELOW").length;
      const rows = list.positions.map(p => {
        const dayClass = (p.dayPct ?? 0) >= 0 ? "pos" : "neg";
        const st = p.status === "ABOVE" ? "above" : "below";
        return `<tr>
          <td class="ticker">${p.ticker}</td>
          <td><span class="status ${st}">${p.status}</span></td>
          <td class="num">${fmtPrice(p.price)}</td>
          <td class="num ${dayClass}">${fmtPct(p.dayPct)}</td>
          <td class="meta">${p.note || ""}</td>
        </tr>`;
      }).join("");
      return `<section>
        <h2>${list.name} <span>${a} above · ${b} below</span></h2>
        <table>
          <thead><tr><th>Ticker</th><th>10DMA</th><th>Price</th><th>Day</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
    }).join("");
  }

  function confluenceClass(c) {
    const v = (c || "").toLowerCase();
    if (v === "strong") return "strong";
    if (v === "weak") return "weak";
    return "mixed";
  }

  function smaClass(v) {
    const value = (v || "").toUpperCase();
    if (value === "ABOVE") return "above";
    if (value === "BELOW") return "below";
    return "neutral";
  }

  function renderMarkets() {
    const data = window.MARKETS_BRIEFING || {};
    const indexesEl = document.getElementById("indexes");
    const etfListEl = document.getElementById("etf-list");
    const moversEl = document.getElementById("movers");
    const upd = document.getElementById("markets-updated");

    if (data.updated == null) {
      upd.textContent = "Waiting for Markets bot ~8:29am UK write to /workspace/shared/dashboard/markets.json";
      indexesEl.innerHTML = "";
      etfListEl.innerHTML = "";
      moversEl.innerHTML = '<section><div class="empty">Waiting for the Markets bot to publish the morning briefing.</div></section>';
      return;
    }

    const headerParts = [
      "Updated " + (data.updated || "—"),
      "Session " + (data.session || "—"),
      "As of " + (data.asOf || "—")
    ];
    if (data.timezone) headerParts.push(data.timezone);
    upd.textContent = headerParts.join(" · ");

    const indexOrder = ["QQQ", "SPMO", "IPO"];
    const indexes = indexOrder.map(ticker =>
      (data.indexes || []).find(index => index.ticker === ticker) || { ticker }
    );
    indexesEl.innerHTML = indexes.map(index => {
      const dayClass = (index.dayPct ?? 0) >= 0 ? "pos" : "neg";
      const smaStatus = index.vsSma50 || "—";
      const conf = confluenceClass(index.confluence);
      const sheet = index.sheetUrl
        ? `<a class="sheet-link" href="${index.sheetUrl}" target="_blank" rel="noopener">Sheet</a>`
        : "";
      return `<div class="market-card index-card">
        <div class="label">Index · SMA50</div>
        <div class="row"><div class="sym">${index.ticker}</div><div class="price">${fmtPrice(index.price)}</div></div>
        <div class="meta name">${index.name || ""}</div>
        <div class="bottom">
          <span class="num ${dayClass}">${fmtPct(index.dayPct)}</span>
          <span class="status ${smaClass(smaStatus)}">SMA50 ${smaStatus}</span>
        </div>
        <div class="bottom">
          <span class="badge ${conf}">${index.confluence || "—"}</span>
          <span class="meta">${index.pctVsSma50 == null ? "" : fmtPct(index.pctVsSma50) + " vs SMA50"}</span>
          ${sheet}
        </div>
      </div>`;
    }).join("");

    const etfList = data.etfList || {};
    const etfs = etfList.etfs || [];
    const listSheet = etfList.sheetUrl
      ? `<a class="sheet-link" href="${etfList.sheetUrl}" target="_blank" rel="noopener">Sheet</a>`
      : "";
    const etfRows = etfs.map(etf => {
      const dayClass = (etf.dayPct ?? 0) >= 0 ? "pos" : "neg";
      const vs = etf.vsSma50 || "—";
      const conf = confluenceClass(etf.confluence);
      return `<tr>
        <td class="ticker">${etf.ticker || "—"}</td>
        <td class="num">${fmtPrice(etf.price)}</td>
        <td class="num ${dayClass}">${fmtPct(etf.dayPct)}</td>
        <td><span class="status ${smaClass(vs)}">${vs}</span>${etf.pctVsSma50 == null ? "" : ` <span class="meta">(${fmtPct(etf.pctVsSma50)})</span>`}</td>
        <td><span class="badge ${conf}">${etf.confluence || "—"}</span></td>
      </tr>`;
    }).join("");
    etfListEl.innerHTML = `<section>
      <h2>ETF list <span>${etfs.length} rows</span></h2>
      <div class="etf-summary">
        <div class="pill">Universe <strong>${etfList.universe ?? "—"}</strong></div>
        <div class="pill">Equal-weight day <strong>${fmtPct(etfList.eqDayPct)}</strong></div>
        <div class="pill">SMA50 <strong>${etfList.smaSummary || "—"}</strong></div>
        ${listSheet}
      </div>
      <div class="table-wrap"><table class="compact">
        <thead><tr><th>Ticker</th><th>Price</th><th>Day</th><th>vs SMA50</th><th>Confluence</th></tr></thead>
        <tbody>${etfRows || '<tr><td colspan="5" class="empty">No ETF-list rows yet.</td></tr>'}</tbody>
      </table></div>
    </section>`;

    const grouped = {};
    (data.movers || []).forEach(mover => {
      const list = mover.list || "Movers";
      const period = mover.period || "other";
      const side = (mover.side || "other").toLowerCase();
      grouped[list] ||= {};
      grouped[list][period] ||= {};
      grouped[list][period][side] ||= [];
      grouped[list][period][side].push(mover);
    });
    const listOrder = ["QQQ", "SPMO", "IPO", "ETF_LIST"];
    const listKeys = listOrder.filter(key => grouped[key]).concat(
      Object.keys(grouped).filter(key => !listOrder.includes(key))
    );
    const periodOrder = ["day", "week", "ytd"];
    moversEl.innerHTML = listKeys.map(list => {
      const periods = periodOrder.filter(period => grouped[list][period]).concat(
        Object.keys(grouped[list]).filter(period => !periodOrder.includes(period))
      );
      const periodHtml = periods.map(period => {
        const sides = grouped[list][period];
        const sideKeys = ["gainer", "loser"].filter(side => sides[side]).concat(
          Object.keys(sides).filter(side => !["gainer", "loser"].includes(side))
        );
        const sideHtml = sideKeys.map(side => {
          const rows = sides[side].sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999)).map(mover => {
            const pctClass = (mover.pct ?? 0) >= 0 ? "pos" : "neg";
            const vs = mover.vsSma50 || "—";
            return `<tr>
              <td class="num">${mover.rank ?? "—"}</td>
              <td class="ticker" title="${mover.name || ""}">${mover.ticker || "—"}</td>
              <td class="num ${pctClass}">${fmtPct(mover.pct)}</td>
              <td><span class="status ${smaClass(vs)}">${vs}</span></td>
            </tr>`;
          }).join("");
          return `<div class="mover-side ${side}">
            <h4>${side}</h4>
            <table><thead><tr><th>Rank</th><th>Ticker</th><th>%</th><th>vs SMA50</th></tr></thead><tbody>${rows}</tbody></table>
          </div>`;
        }).join("");
        return `<div class="mover-period">
          <h3>${period.toUpperCase()} <span>${sideKeys.map(side => `${side}: ${sides[side].length}`).join(" · ")}</span></h3>
          <div class="mover-sides">${sideHtml}</div>
        </div>`;
      }).join("");
      return `<section><h2>${list} movers <span>${Object.values(grouped[list]).reduce((total, period) => total + Object.values(period).reduce((subtotal, side) => subtotal + side.length, 0), 0)} rows</span></h2>${periodHtml}</section>`;
    }).join("");
    if (!listKeys.length) moversEl.innerHTML = '<section><div class="empty">No movers yet.</div></section>';
  }

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      const pos = window.POSITIONS_10DMA;
      const mkt = window.MARKETS_BRIEFING;
      if (btn.dataset.tab === "markets" && mkt && mkt.updated) {
        document.getElementById("header-updated").textContent =
          "Markets · " + mkt.updated + (mkt.session ? " · " + mkt.session : "");
      } else if (pos && pos.updated) {
        document.getElementById("header-updated").textContent =
          "Positions · " + pos.updated + (pos.session ? " · " + pos.session : "");
      }
    });
  });

  renderPositions();
  renderMarkets();
</script>
</body>
</html>
