<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading dashboard</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --border: #2a3544;
    --text: #e7ecf3;
    --muted: #8b9bb0;
    --above: #3dd68c;
    --above-bg: rgba(61, 214, 140, 0.12);
    --below: #ff6b6b;
    --below-bg: rgba(255, 107, 107, 0.14);
    --accent: #5b9fd4;
    --accent-bg: rgba(91, 159, 212, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 1.5rem;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 1rem;
  }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.65rem;
  }
  .tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    background: var(--accent-bg);
    border-color: var(--border);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .market {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .market-card, .etf-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .market-card .label, .etf-card .label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.35rem;
  }
  .market-card .row, .etf-card .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .sym { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
  .price { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bottom {
    margin-top: 0.55rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
  }
  .pill strong { font-weight: 650; }
  .pill.ok strong { color: var(--above); }
  .pill.bad strong { color: var(--below); }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  section h2 span { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 0.65rem 1rem; text-align: left; }
  th { color: var(--muted); font-weight: 550; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .ticker { font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .status, .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 650;
    letter-spacing: 0.03em;
  }
  .status.above, .badge.strong { color: var(--above); background: var(--above-bg); }
  .status.below, .badge.weak { color: var(--below); background: var(--below-bg); }
  .badge.mixed { color: var(--accent); background: var(--accent-bg); }
  .num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--above); }
  .neg { color: var(--below); }
  .empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--muted);
  }
  footer {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Trading dashboard</h1>
      <div class="meta">Positions 10DMA · Markets (QQQ / SPMO / IPO)</div>
    </div>
    <div class="meta" id="header-updated">—</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="positions" type="button">Positions</button>
    <button class="tab" data-tab="markets" type="button">Markets</button>
  </div>

  <div id="panel-positions" class="panel active">
    <div class="market" id="market"></div>
    <div class="summary">
      <div class="pill">Positions <strong id="total-count">—</strong></div>
      <div class="pill ok">Above <strong id="above-count">—</strong></div>
      <div class="pill bad">Below <strong id="below-count">—</strong></div>
    </div>
    <div id="lists"></div>
  </div>

  <div id="panel-markets" class="panel">
    <div class="meta" id="markets-updated" style="margin-bottom:0.85rem"></div>
    <div class="market" id="etfs"></div>
    <div id="movers"></div>
  </div>

  <footer>
    Sources: Deepvue (positions) · Markets bot (QQQ/SPMO/IPO) · Not financial advice
  </footer>

<script>
  window.POSITIONS_10DMA = {
    updated: "Wed 23 Sep 2026, 8:12pm UK",
    session: "Evening snapshot",
    market: [
      {ticker: "SPY", status: "ABOVE", price: 768.17, dayPct: -0.67, note: "~0.6% above 10DMA"},
      {ticker: "QQQ", status: "ABOVE", price: 741.27, dayPct: -0.83, note: ""}
    ],
    lists: [
      {
        name: "FT Positions",
        positions: [
          {ticker: "PLTR", status: "ABOVE", price: 190.85, dayPct: 3.17, note: ""},
          {ticker: "BE", status: "ABOVE", price: 273.43, dayPct: -1.12, note: ""},
          {ticker: "IREN", status: "ABOVE", price: 48.03, dayPct: -1.07, note: ""},
          {ticker: "LITE", status: "ABOVE", price: 934.00, dayPct: -1.23, note: ""},
          {ticker: "INTC", status: "ABOVE", price: 121.01, dayPct: -2.30, note: ""},
          {ticker: "SNDK", status: "ABOVE", price: 1814.80, dayPct: -3.83, note: ""},
          {ticker: "TAOX", status: "ABOVE", price: 4.29, dayPct: -4.45, note: ""}
        ]
      },
      {
        name: "IBKR Positions",
        positions: [
          {ticker: "TQQQ", status: "ABOVE", price: 78.61, dayPct: -2.75, note: ""},
          {ticker: "BMNR", status: "ABOVE", price: 27.54, dayPct: -4.26, note: ""},
          {ticker: "TEM", status: "ABOVE", price: 76.08, dayPct: -1.44, note: ""},
          {ticker: "IREN", status: "ABOVE", price: 48.19, dayPct: -0.74, note: ""},
          {ticker: "ARM", status: "ABOVE", price: 334.23, dayPct: 0.31, note: ""}
        ]
      },
      {
        name: "Hive portfolio",
        positions: [
          {ticker: "META", status: "ABOVE", price: 748.53, dayPct: 1.62, note: ""},
          {ticker: "TSLA", status: "ABOVE", price: 380.09, dayPct: 0.32, note: ""},
          {ticker: "SPY", status: "ABOVE", price: 768.17, dayPct: -0.67, note: "~0.6% above 10DMA"},
          {ticker: "QQQ", status: "ABOVE", price: 741.27, dayPct: -0.83, note: ""},
          {ticker: "NVDA", status: "ABOVE", price: 225.31, dayPct: -1.56, note: ""},
          {ticker: "TEM", status: "ABOVE", price: 76.10, dayPct: -1.41, note: ""},
          {ticker: "AMZN", status: "BELOW", price: 250.06, dayPct: -1.93, note: "~1% below 10DMA"},
          {ticker: "GOOGL", status: "BELOW", price: 339.53, dayPct: -3.31, note: ""},
          {ticker: "SERV", status: "BELOW", price: 4.39, dayPct: -3.41, note: "near 10DMA (~0.2% below)"}
        ]
      }
    ]
  };

  // Filled by Markets bot each morning (QQQ / SPMO / IPO briefing).
  window.MARKETS_BRIEFING = {
    updated: null,
    session: null,
    etfs: [],
    movers: []
  };

  function fmtPct(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return "—";
    return (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%";
  }
  function fmtPrice(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return "—";
    return Number(n).toLocaleString("en-US", { style: "currency", currency: "USD" });
  }

  function renderPositions() {
    const data = window.POSITIONS_10DMA;
    const listsEl = document.getElementById("lists");
    const marketEl = document.getElementById("market");
    if (!data.updated || !data.lists || !data.lists.length) {
      listsEl.innerHTML = '<section><div class="empty">No positions snapshot yet.</div></section>';
      return;
    }
    document.getElementById("header-updated").textContent =
      "Positions · " + data.updated + (data.session ? " · " + data.session : "");

    marketEl.innerHTML = (data.market || []).map(m => {
      const st = m.status === "ABOVE" ? "above" : "below";
      const dayClass = (m.dayPct ?? 0) >= 0 ? "pos" : "neg";
      return `<div class="market-card">
        <div class="label">Market · 10DMA</div>
        <div class="row"><div class="sym">${m.ticker}</div><div class="price">${fmtPrice(m.price)}</div></div>
        <div class="bottom">
          <span class="status ${st}">${m.status}</span>
          <span class="num ${dayClass}">${fmtPct(m.dayPct)}</span>
        </div>
        ${m.note ? `<div class="meta" style="margin-top:0.45rem">${m.note}</div>` : ""}
      </div>`;
    }).join("");

    let above = 0, below = 0, total = 0;
    data.lists.forEach(list => list.positions.forEach(p => {
      total++; if (p.status === "ABOVE") above++; else below++;
    }));
    document.getElementById("total-count").textContent = total;
    document.getElementById("above-count").textContent = above;
    document.getElementById("below-count").textContent = below;

    listsEl.innerHTML = data.lists.map(list => {
      const a = list.positions.filter(p => p.status === "ABOVE").length;
      const b = list.positions.filter(p => p.status === "BELOW").length;
      const rows = list.positions.map(p => {
        const dayClass = (p.dayPct ?? 0) >= 0 ? "pos" : "neg";
        const st = p.status === "ABOVE" ? "above" : "below";
        return `<tr>
          <td class="ticker">${p.ticker}</td>
          <td><span class="status ${st}">${p.status}</span></td>
          <td class="num">${fmtPrice(p.price)}</td>
          <td class="num ${dayClass}">${fmtPct(p.dayPct)}</td>
          <td class="meta">${p.note || ""}</td>
        </tr>`;
      }).join("");
      return `<section>
        <h2>${list.name} <span>${a} above · ${b} below</span></h2>
        <table>
          <thead><tr><th>Ticker</th><th>10DMA</th><th>Price</th><th>Day</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
    }).join("");
  }

  function confluenceClass(c) {
    const v = (c || "").toLowerCase();
    if (v === "strong") return "strong";
    if (v === "weak") return "weak";
    return "mixed";
  }

  function renderMarkets() {
    const data = window.MARKETS_BRIEFING || {};
    const etfsEl = document.getElementById("etfs");
    const moversEl = document.getElementById("movers");
    const upd = document.getElementById("markets-updated");

    if (!data.updated || !(data.etfs && data.etfs.length)) {
      upd.textContent = "Waiting for Markets bot morning briefing…";
      etfsEl.innerHTML = "";
      moversEl.innerHTML = '<section><div class="empty">Markets tab fills after the weekday ~8:29am UK Markets bot run (QQQ / SPMO / IPO · SMA50 · D+W MACD).</div></section>';
      return;
    }
    upd.textContent = data.updated + (data.session ? " · " + data.session : "");

    etfsEl.innerHTML = data.etfs.map(e => {
      const dayClass = (e.dayPct ?? 0) >= 0 ? "pos" : "neg";
      const vs = (e.vsSma50 || "").toUpperCase() === "ABOVE" ? "above" : "below";
      const conf = confluenceClass(e.confluence);
      return `<div class="etf-card">
        <div class="label">ETF · SMA50 · MACD D+W</div>
        <div class="row"><div class="sym">${e.ticker}</div><div class="price">${fmtPrice(e.price)}</div></div>
        <div class="bottom">
          <span class="status ${vs}">SMA50 ${e.vsSma50 || "—"}</span>
          <span class="badge ${conf}">${e.confluence || "—"}</span>
          <span class="num ${dayClass}">${fmtPct(e.dayPct)}</span>
        </div>
        ${e.note ? `<div class="meta" style="margin-top:0.45rem">${e.note}</div>` : ""}
      </div>`;
    }).join("");

    const byList = {};
    (data.movers || []).forEach(m => {
      const k = m.list || "Movers";
      (byList[k] = byList[k] || []).push(m);
    });
    const keys = Object.keys(byList);
    if (!keys.length) {
      moversEl.innerHTML = "";
      return;
    }
    moversEl.innerHTML = keys.map(k => {
      const rows = byList[k].map(m => {
        const dayClass = (m.dayPct ?? 0) >= 0 ? "pos" : "neg";
        return `<tr>
          <td class="ticker">${m.ticker}</td>
          <td class="num ${dayClass}">${fmtPct(m.dayPct)}</td>
          <td class="meta">${m.note || ""}</td>
        </tr>`;
      }).join("");
      return `<section>
        <h2>${k} movers <span>${byList[k].length}</span></h2>
        <table>
          <thead><tr><th>Ticker</th><th>Day</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
    }).join("");
  }

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      const pos = window.POSITIONS_10DMA;
      const mkt = window.MARKETS_BRIEFING;
      if (btn.dataset.tab === "markets" && mkt && mkt.updated) {
        document.getElementById("header-updated").textContent =
          "Markets · " + mkt.updated + (mkt.session ? " · " + mkt.session : "");
      } else if (pos && pos.updated) {
        document.getElementById("header-updated").textContent =
          "Positions · " + pos.updated + (pos.session ? " · " + pos.session : "");
      }
    });
  });

  renderPositions();
  renderMarkets();
</script>
</body>
</html>
