<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading dashboard</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --border: #2a3544;
    --text: #e7ecf3;
    --muted: #8b9bb0;
    --above: #3dd68c;
    --above-bg: rgba(61, 214, 140, 0.12);
    --below: #ff6b6b;
    --below-bg: rgba(255, 107, 107, 0.14);
    --accent: #5b9fd4;
    --accent-bg: rgba(91, 159, 212, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 1.5rem;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 1rem;
  }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.65rem;
  }
  .tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    background: var(--accent-bg);
    border-color: var(--border);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .market {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .market-card, .etf-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .market-card .label, .etf-card .label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.35rem;
  }
  .market-card .row, .etf-card .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .sym { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
  .price { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bottom {
    margin-top: 0.55rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
  }
  .pill strong { font-weight: 650; }
  .pill.ok strong { color: var(--above); }
  .pill.bad strong { color: var(--below); }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  section h2 span { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  .index-card .name { margin-top: 0.35rem; min-height: 1.3em; }
  .sheet-link { color: var(--accent); text-decoration: none; font-size: 0.82rem; }
  .sheet-link:hover { text-decoration: underline; }
  .status.neutral { color: var(--muted); background: rgba(139, 155, 176, 0.12); }
  .etf-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .etf-summary .pill { margin: 0; }
  .table-wrap { overflow-x: auto; }
  .compact th, .compact td { padding: 0.52rem 0.8rem; }
  .mover-period { padding: 0.8rem 1rem 0; }
  .mover-period:last-child { padding-bottom: 1rem; }
  .mover-period h3 {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin: 0 0 0.55rem;
    color: var(--text);
    font-size: 0.88rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .mover-period h3 span { color: var(--muted); font-size: 0.78rem; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .mover-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0.75rem; }
  .mover-side { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mover-side h4 { margin: 0; padding: 0.5rem 0.7rem; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .mover-side.gainer h4 { color: var(--above); background: var(--above-bg); }
  .mover-side.loser h4 { color: var(--below); background: var(--below-bg); }
  .mover-side table { font-size: 0.86rem; }
  .mover-side th, .mover-side td { padding: 0.45rem 0.65rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 0.65rem 1rem; text-align: left; }
  th { color: var(--muted); font-weight: 550; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .ticker { font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .status, .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 650;
    letter-spacing: 0.03em;
  }
  .status.above, .badge.strong { color: var(--above); background: var(--above-bg); }
  .status.below, .badge.weak { color: var(--below); background: var(--below-bg); }
  .badge.mixed { color: var(--accent); background: var(--accent-bg); }
  .num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--above); }
  .neg { color: var(--below); }
  .empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--muted);
  }
  footer {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Trading dashboard</h1>
      <div class="meta">Positions 10DMA · Markets (QQQ / SPMO / IPO)</div>
    </div>
    <div class="meta" id="header-updated">—</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="positions" type="button">Positions</button>
    <button class="tab" data-tab="markets" type="button">Markets</button>
  </div>

  <div id="panel-positions" class="panel active">
    <div class="market" id="market"></div>
    <div class="summary">
      <div class="pill">Positions <strong id="total-count">—</strong></div>
      <div class="pill ok">Above <strong id="above-count">—</strong></div>
      <div class="pill bad">Below <strong id="below-count">—</strong></div>
    </div>
    <div id="lists"></div>
  </div>

  <div id="panel-markets" class="panel">
    <div class="meta" id="markets-updated" style="margin-bottom:0.85rem"></div>
    <div class="market" id="indexes"></div>
    <div id="etf-list"></div>
    <div id="movers"></div>
  </div>

  <footer>
    Sources: Deepvue (positions) · Markets bot (QQQ/SPMO/IPO) · Not financial advice
